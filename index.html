<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Editor de save Pokémon GBA por zonas (R.O.W.E., Super Dark Worship e outras)." />
  <title>Poké Save Manager</title>
  <link rel="stylesheet" href="css/app.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("pokhsave-theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2318181b' stroke='%2310b981' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%2310b981'/%3E%3C/svg%3E" />
</head>
<body>
  <header>
    <div>
      <h1>Poké Save</h1>
      <p id="headerSub">Zona · Salve GBA</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button type="button" class="btn" id="btnTheme" title="Alternar tema claro/escuro" aria-label="Tema">🌙</button>
      <button type="button" class="btn btn-primary hidden" id="btnDownload">Baixar</button>
      <button type="button" class="btn" id="btnOpen">Abrir save</button>
    </div>
  </header>

  <div id="error" class="error hidden"></div>

  <div id="empty" class="empty">
    <div class="card">
      <div class="icon" aria-hidden="true"></div>
      <h2>Editor de save · estilo Pokémon</h2>
      <p>Escolha a <strong>zona</strong> (ROM) e abra o arquivo <strong>.sav</strong> de 128 KB. Cada zona tem offsets e formato próprios — não misture saves.</p>

      <label for="zoneSelect" style="display:block;margin:16px 0 6px;font-size:13px;color:var(--muted);text-align:left">Zona ativa</label>
      <select id="zoneSelect" class="zone-select" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px"></select>
      <p id="zoneDesc" style="font-size:12px;color:var(--muted);margin-top:8px;text-align:left"></p>

      <button type="button" class="btn btn-primary btn-block" id="btnOpen2" style="margin-top:20px">Abrir arquivo .sav</button>
    </div>
    <p style="font-size:12px;color:var(--muted);max-width:280px">
      Funciona no navegador do celular. Use “Adicionar à tela inicial” para usar como app.
    </p>
  </div>

  <div id="main" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="tabs">
      <button type="button" data-tab="party" class="active">Time</button>
      <button type="button" data-tab="boxes">Caixas</button>
      <button type="button" data-tab="bag">Mochila</button>
      <button type="button" data-tab="trainer">Treinador</button>
    </div>
    <div id="list" class="list"></div>
    <div id="editor" class="editor"></div>
  </div>

  <input type="file" id="fileInput" accept=".sav,application/octet-stream" />

  <script type="module" src="js/app.js"></script>
</body>
</html>
